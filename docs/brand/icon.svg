<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="jt-snmpd">
  <title>jt-snmpd</title>
  <!--
    An OID tree: one root branching into leaves.

    SNMP's defining structure is a hierarchical tree of object identifiers, so a
    tree is the most direct thing the mark can say. It is drawn with a single
    stroke weight and generous spacing because the first version tried to layer a
    pulse line over the branches — legible at 256px, mush at 16px, which is the
    size that actually matters in a browser tab and a Windows service list.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b48d"/>
      <stop offset="1" stop-color="#0d6551"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <g fill="none" stroke="#fff" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 根 → 主幹 -->
    <path d="M64 128 H104"/>
    <!-- 主幹上下展開 -->
    <path d="M104 72 V184"/>
    <!-- 三條分枝 -->
    <path d="M104 72  H150"/>
    <path d="M104 128 H150"/>
    <path d="M104 184 H150"/>
  </g>

  <g fill="#fff">
    <circle cx="64"  cy="128" r="17"/>
    <circle cx="166" cy="72"  r="15"/>
    <circle cx="166" cy="128" r="15"/>
    <circle cx="166" cy="184" r="15"/>
  </g>
</svg>
