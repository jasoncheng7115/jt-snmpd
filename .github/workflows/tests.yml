# Cross-platform tests. The suite parses the source with ast rather than running
# it, so it needs neither Windows nor SNMP and the whole thing runs on Linux --
# including the tests that feed the parsers malicious bytes.
#
# The MSI is built here too, on every push. It used to be built only when a tag
# was pushed, which meant a WiX error could not be discovered until the release
# was already tagged. That happened: v0.9.4 was tagged and its build failed on
# three WIX0103 errors. Building on every push moves that discovery to where it
# belongs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install net-snmp
        # The protocol-correctness tests drive the agent with a real net-snmp
        # client. Without it they skip -- and they are the GETNEXT and GETBULK
        # ones. Skipping quietly is worse than not having them, so install it
        # and confirm it is there.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq snmp
          command -v snmpbulkwalk || { echo "::error::snmpbulkwalk is not installed"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Confirm the protocol-correctness tests actually ran
        run: |
          python -m pytest tests/test_walk_correctness.py -q --tb=line \
            | tee /tmp/walk.txt
          grep -qE '[0-9]+ passed' /tmp/walk.txt || {
            echo "::error::walk correctness tests did not run"; exit 1; }

      - name: Privacy and secret scan
        # Run on every push to the public repo. Images go through
        # review-and-hash: a hash that no longer matches blocks the push,
        # because a regular expression cannot read pixels.
        run: python3 tools/check-privacy.py

      - name: Taiwanese terminology
        # The customers are Taiwanese agencies and hospitals. Wording that reads
        # as translated has been corrected by hand a dozen times here, always by
        # someone reading the finished page, which is the most expensive place
        # to catch it.
        run: python3 tools/check-terminology.py

  build-msi:
    # The WiX source is checked statically by tests/test_msi_ui_gating.py, but
    # static checks cannot tell whether wix.exe will accept it. Three classes of
    # failure only appear at build time: a missing binary the UI extension needs,
    # an extension version mismatch, and an ICE validation error. Each has cost a
    # release, so the build runs on every push rather than only on a tag.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Confirm the generated wizard assets are current
        # banner.bmp, dialog.bmp and license.rtf are committed, and generated
        # from docs/brand/icon-512.png and LICENSE. If either source changes and
        # nobody regenerates, the installer keeps showing the previous artwork or
        # -- far worse -- a licence that no longer matches the repository's.
        shell: pwsh
        run: |
          # Pinned to the version that generated the committed BMPs. This step
          # regenerates them and compares hashes, so a different Pillow that
          # encodes a byte differently fails the check for no real reason.
          pip install pillow==10.2.0
          $before = Get-ChildItem packaging/wix/banner.bmp, packaging/wix/dialog.bmp, packaging/wix/license.rtf |
                    ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          python packaging/make-ui-assets.py
          $after = Get-ChildItem packaging/wix/banner.bmp, packaging/wix/dialog.bmp, packaging/wix/license.rtf |
                   ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          if (Compare-Object $before $after) {
            Write-Host "::error::the committed wizard assets do not match what packaging/make-ui-assets.py produces; regenerate and commit them"
            exit 1
          }
          Write-Host "wizard assets are current"

      - name: Build the executable
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $out = .\packaging\build-exe.ps1 -Python $py -Source deploy\jt_agent.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'FAIL|error|Error|ERROR|Traceback') { Write-Host "::error::$t" }
            }
            exit 1
          }

      - name: Install WiX 5 and its extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build the MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $out = .\packaging\build-msi.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'WIX\d{3,4}|\[FAIL\]|\[!\]|error |Exception') {
                Write-Host "::error::$t"
              }
            }
            Write-Host "::error::build-msi.ps1 exited $LASTEXITCODE"
            exit 1
          }

      - name: Confirm the wizard routes through the settings page
        # Static analysis says the source is right; this says the *built MSI* is.
        # 0.9.3 shipped with the route to the settings page published at an Order
        # that WixUI's own row overruled, so the page never appeared and the
        # install failed with nothing configured. The source looked fine. Read
        # the ControlEvent table out of the artefact instead.
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\jt-snmpd-*-x64.msi | Select-Object -First 1).FullName
          $bt  = [char]96
          $si = New-Object -ComObject WindowsInstaller.Installer
          $db = $si.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$si,@([string]$msi,[int]0))
          $sql = "SELECT ${bt}Event${bt},${bt}Argument${bt},${bt}Ordering${bt} FROM ${bt}ControlEvent${bt} WHERE ${bt}Dialog_${bt}='InstallDirDlg' AND ${bt}Control_${bt}='Next'"
          $vw = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@([string]$sql))
          $vw.GetType().InvokeMember('Execute','InvokeMethod',$null,$vw,$null)
          $rows = @()
          while ($true) {
            $rec = $vw.GetType().InvokeMember('Fetch','InvokeMethod',$null,$vw,$null)
            if ($null -eq $rec) { break }
            $rows += ,@(
              [string]$rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,[int]1),
              [string]$rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,[int]2),
              [int]$rec.GetType().InvokeMember('IntegerData','GetProperty',$null,$rec,[int]3))
          }
          $rows | ForEach-Object { Write-Host ("  {0} | {1} | {2}" -f $_[0], $_[1], $_[2]) }
          $ours = $rows | Where-Object { $_[0] -eq 'NewDialog' -and $_[1] -eq 'JtSettingsDlg' }
          $wix  = $rows | Where-Object { $_[0] -eq 'NewDialog' -and $_[1] -eq 'VerifyReadyDlg' }
          if (-not $ours) {
            Write-Host "::error::the built MSI has no route from InstallDirDlg to JtSettingsDlg"
            exit 1
          }
          if ($wix -and $ours[2] -le $wix[2]) {
            Write-Host ("::error::JtSettingsDlg is published at Order {0} but WixUI publishes VerifyReadyDlg at Order {1}; the settings page will be skipped" -f $ours[2], $wix[2])
            exit 1
          }
          Write-Host "the settings page is on the route"

      - name: Confirm Windows Installer stops the service itself
        # Windows Installer should own stopping the service the package ships,
        # rather than that happening only inside a custom action.
        #
        # This does NOT remove the "Files in use" page from graphical upgrades:
        # InstallValidate is at sequence 1400 and StopServices at 1900, so
        # Restart Manager has already looked before any of this runs, and the
        # page still appears when driven through the wizard. TEST_PLAN 6.1c.12
        # keeps that open. A table check can see a declaration; it cannot see a
        # behaviour.
        #
        # Event is a bitmask: 2 stop-on-install, 32 stop-on-uninstall,
        # 1 start-on-install, 16 start-on-uninstall. Stopping is ours to
        # declare; starting is not, because config.json is written later.
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\jt-snmpd-*-x64.msi | Select-Object -First 1).FullName
          $bt  = [char]96
          $si  = New-Object -ComObject WindowsInstaller.Installer
          $db  = $si.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$si,@([string]$msi,[int]0))
          $sql = "SELECT ${bt}Name${bt},${bt}Event${bt} FROM ${bt}ServiceControl${bt}"
          $vw  = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@([string]$sql))
          $vw.GetType().InvokeMember('Execute','InvokeMethod',$null,$vw,$null)
          $rec = $vw.GetType().InvokeMember('Fetch','InvokeMethod',$null,$vw,$null)
          if ($null -eq $rec) {
            Write-Host "::error::the built MSI has no ServiceControl row; a graphical upgrade will ask the operator to close jt-snmpd.exe"
            exit 1
          }
          $name  = [string]$rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,[int]1)
          $event = [int]$rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,[int]2)
          if ($name -ne 'jt-snmpd') {
            Write-Host "::error::ServiceControl names '$name', not the agent service"
            exit 1
          }
          if (-not ($event -band 2)) {
            Write-Host "::error::ServiceControl Event=$event does not stop the service on install"
            exit 1
          }
          if ($event -band 1) {
            Write-Host "::error::ServiceControl Event=$event starts the service on install; config.json is not written until later"
            exit 1
          }
          Write-Host "ServiceControl: $name Event=$event"

      - name: Confirm the optional checkbox starts unticked
        # Windows Installer draws a checkbox ticked whenever its property is
        # non-empty, and "0" is non-empty. 0.9.4 shipped KEEPMSSNMP="0", so the
        # "keep the built-in SNMP service" box appeared ticked while the
        # installer disabled the service. Reading the source cannot catch this;
        # reading the Property table of the artefact can.
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\jt-snmpd-*-x64.msi | Select-Object -First 1).FullName
          $bt  = [char]96
          $si  = New-Object -ComObject WindowsInstaller.Installer
          $db  = $si.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$si,@([string]$msi,[int]0))
          $sql = "SELECT ${bt}Property${bt},${bt}Value${bt} FROM ${bt}Property${bt} WHERE ${bt}Property${bt}='KEEPMSSNMP'"
          $vw  = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@([string]$sql))
          $vw.GetType().InvokeMember('Execute','InvokeMethod',$null,$vw,$null)
          $rec = $vw.GetType().InvokeMember('Fetch','InvokeMethod',$null,$vw,$null)
          if ($null -ne $rec) {
            $v = [string]$rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,[int]2)
            if ($v -ne '') {
              Write-Host "::error::KEEPMSSNMP defaults to '$v' in the built MSI; any non-empty value draws the checkbox ticked, contradicting its own label"
              exit 1
            }
          }
          Write-Host "the optional checkbox starts unticked"

      - name: Confirm the licence page is not a placeholder
        # WiX substitutes Lorem ipsum when WixUILicenseRtf is unset, and 0.9.3
        # shipped exactly that: a document presented as terms of use, saying
        # nothing, for GPL-3.0-or-later software.
        shell: pwsh
        run: |
          $rtf = Get-Content packaging\wix\license.rtf -Raw
          if ($rtf -match 'Lorem ipsum') {
            Write-Host "::error::the licence page is still WiX's placeholder text"
            exit 1
          }
          if ($rtf -notmatch 'GNU GENERAL PUBLIC LICENSE') {
            Write-Host "::error::the licence page does not show the GPL"
            exit 1
          }
          Write-Host "the licence page shows the repository's own LICENSE"

      - name: Keep the MSI for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: msi-${{ github.sha }}
          path: dist/jt-snmpd-*-x64.msi
          retention-days: 14
