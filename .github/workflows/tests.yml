# 跨平台測試。測試以 ast 靜態解析原始碼，不需要 Windows 也不需要 SNMP，
# 因此可以在 Linux 上跑完整套——包含那些「用惡意位元組餵解析器」的測試。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 net-snmp
        # 協定正確性測試以真實的 net-snmp 用戶端驅動 agent。缺了它們會跳過，
        # 而那正是驗 GETNEXT／GETBULK 的那一批——悄悄不跑比沒有還糟，
        # 所以這裡裝好並確認存在。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq snmp
          command -v snmpbulkwalk || { echo "::error::snmpbulkwalk 未安裝"; exit 1; }

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install pysnmp pytest

      - name: 執行測試
        run: python -m pytest tests/ -q --tb=short

      - name: 確認協定正確性測試沒有被跳過
        run: |
          python -m pytest tests/test_walk_correctness.py -q --tb=line \
            | tee /tmp/walk.txt
          grep -qE '[0-9]+ passed' /tmp/walk.txt || {
            echo "::error::walk correctness tests did not run"; exit 1; }

      - name: 個資／機密掃描
        # 推上公開 repo 的每一次都要掃。圖片走「人工審閱 + 雜湊」，
        # 雜湊對不上會擋下——正規表示式讀不到像素。
        run: python3 tools/check-privacy.py
