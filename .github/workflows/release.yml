# 打上 v* 標籤即發版：在 Windows 執行器上建置 MSI，跑自我測試，
# 建立 GitHub Release 並附上安裝檔。
#
# 用 GITHUB_TOKEN 而非個人存取權杖：它由 Actions 自動提供，
# 權限僅限本 repo 且隨工作結束失效，不需要任何人手動保管憑證。
#
# **這裡建出來的 MSI 未經 Authenticode 簽章**（SignPath Foundation 申請中）。
# 在 WDAC 環境部署前必須先簽章。簽章到位後，簽章步驟會加在 build 與
# release 之間，屆時 Release 附的就是已簽章的版本。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發版的標籤（例如 v0.9.0）'
        required: true

permissions:
  contents: write      # 建立 Release 與上傳附件所需

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pysnmp pywin32 pyinstaller pytest

      - name: 執行測試
        # 失敗時把 pytest 的摘要以 ::error:: 送出，讓它變成工作流程註記。
        # GitHub 的執行日誌需要認證才讀得到，註記則是公開的——
        # 沒有這一步，遠端偵錯就只剩下「exit code 1」這個資訊。
        shell: pwsh
        run: |
          $out = python -m pytest tests/ -q --tb=line 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out -split "`n")) {
              $t = $line.Trim()
              if ($t -match '^(FAILED|ERROR)\s' -or $t -match '^E\s' -or
                  $t -match '^\S+\.py:\d+:' -or $t -match '^\d+ failed') {
                Write-Host "::error::$t"
              }
            }
            exit 1
          }

      - name: 確認標籤與 version.py 一致
        # 版本只能有一個來源。標籤與 version.py 不一致時，
        # 使用者下載到的檔名與 agent 回報的 jtAgentVersion 會對不起來，
        # 而那個 OID 的用途正是「升級數百台後一次 walk 得知哪台沒升成功」。
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
                   $env:GITHUB_REF -replace '^refs/tags/v?',''
                 } else { '${{ inputs.tag }}' -replace '^v','' }
          $ver = (Select-String -Path deploy/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "標籤=$tag  version.py=$ver"
          if ($tag -ne $ver) {
            Write-Host "::error::標籤 v$tag 與 deploy/version.py 的 $ver 不一致"
            exit 1
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 建置執行檔（含 --selftest 閘門）
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $out = .\packaging\build-exe.ps1 -Python $py -Source deploy\jt_agent.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'FAIL|error|Error|ERROR|Traceback') { Write-Host "::error::$t" }
            }
            Write-Host "::error::build-exe.ps1 exited $LASTEXITCODE"
            exit 1
          }

      - name: 安裝 WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.*

      - name: 建置 MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $out = .\packaging\build-msi.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # WiX 的錯誤是 WIXnnnn 形式；建置腳本自己的失敗是 [FAIL]。
            # 兩者都要送成註記——GitHub 的執行日誌需要認證才讀得到，
            # 只有註記是公開的，而「exit code 1」不構成診斷。
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'WIX\d{3,4}|\[FAIL\]|\[!\]|error |Exception') {
                Write-Host "::error::$t"
              }
            }
            Write-Host "::error::build-msi.ps1 exited $LASTEXITCODE"
            exit 1
          }

      - name: 產生 SHA-256
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\jt-snmpd-*-x64.msi | Select-Object -First 1
          $h = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($msi.Name)" | Out-File "$($msi.FullName).sha256" -Encoding ascii
          Write-Host "SHA256 $h"
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 從 CHANGELOG 取出本版說明
        shell: pwsh
        run: |
          $body = @()
          $body += "以標準 MIB 提供 Windows 主機監控資料的唯讀 SNMP Agent。"
          $body += ""
          $body += "## 安裝"
          $body += ''
          $body += '```'
          $body += "msiexec /i jt-snmpd-$env:VERSION-x64.msi /qn ``"
          $body += "  MANAGEMENTNETWORKS=10.0.0.0/24 ``"
          $body += "  COMMUNITY=<你的 community>"
          $body += '```'
          $body += ""
          $body += "安裝程式會偵測內建 SNMP Service、沿用其設定，然後停用它（停用，不移除）；"
          $body += "解除安裝時自動還原。"
          $body += ""
          $body += "> **本安裝檔未經 Authenticode 簽章**（SignPath Foundation 申請中）。"
          $body += "> 在 WDAC 環境部署前必須先完成簽章。"
          $body += ""
          $body += "完整變更見 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          $body += "／[CHANGELOG_zh-TW.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG_zh-TW.md)。"
          $body -join "`n" | Out-File RELEASE_NOTES.md -Encoding utf8

      - name: 建立 Release 並上傳
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' }
                 else { '${{ inputs.tag }}' }
          gh release create $tag `
            "$env:MSI_PATH" "$env:MSI_PATH.sha256" `
            --title "jt-snmpd $tag" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
