# Pushing a v* tag ships a release: build the MSI on a Windows runner, run the
# self-tests, create the GitHub Release and attach the installer.
#
# GITHUB_TOKEN rather than a personal access token: Actions provides it
# automatically, it is scoped to this repository alone, and it expires with the
# job — nobody has to hold a long-lived credential.
#
# **The MSI built here is not Authenticode signed**, and there is no plan to
# obtain a certificate. Integrity is established by the SHA-256 published
# alongside each asset instead. docs/code-signing.md covers what an unsigned
# installer looks like at install time and how to deal with it, including the
# WDAC hash-rule and sign-it-yourself routes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.9.0)'
        required: true

permissions:
  contents: write      # required to create the Release and upload assets

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        # On failure, emit pytest's summary lines as ::error:: so they become
        # workflow annotations. GitHub's run logs need authentication to read;
        # annotations are public. Without this, remote diagnosis is limited to
        # "exit code 1".
        shell: pwsh
        run: |
          $out = python -m pytest tests/ -q --tb=line 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out -split "`n")) {
              $t = $line.Trim()
              if ($t -match '^(FAILED|ERROR)\s' -or $t -match '^E\s' -or
                  $t -match '^\S+\.py:\d+:' -or $t -match '^\d+ failed') {
                Write-Host "::error::$t"
              }
            }
            exit 1
          }

      - name: Verify the tag matches version.py
        # The version has exactly one source. If the tag and version.py
        # disagree, the file name the user downloads no longer matches the
        # jtAgentVersion the agent reports — and that OID exists precisely to
        # answer "we upgraded several hundred machines, which ones did not
        # take?" in a single walk.
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
                   $env:GITHUB_REF -replace '^refs/tags/v?',''
                 } else { '${{ inputs.tag }}' -replace '^v','' }
          $ver = (Select-String -Path deploy/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  version.py=$ver"
          if ($tag -ne $ver) {
            Write-Host "::error::tag v$tag does not match $ver in deploy/version.py"
            exit 1
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the executable (with the --selftest gate)
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $out = .\packaging\build-exe.ps1 -Python $py -Source deploy\jt_agent.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'FAIL|error|Error|ERROR|Traceback') { Write-Host "::error::$t" }
            }
            Write-Host "::error::build-exe.ps1 exited $LASTEXITCODE"
            exit 1
          }

      - name: Install WiX 5 and its extensions
        # `dotnet tool install wix` installs wix.exe alone. The extensions this
        # project uses have to be added separately, or the build fails with
        # WIX0144 "extension could not be found".
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          # Pin the version: left unspecified this resolves to the newest (7.x),
          # which is incompatible with WiX v5 and fails the build with WIX6101
          # "Could not find expected package root folder wixext5".
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension list -g

      - name: Build the MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $out = .\packaging\build-msi.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # WiX errors take the form WIXnnnn; the build script's own failures
            # are [FAIL]. Both have to become annotations — GitHub's run logs
            # need authentication to read, only annotations are public, and
            # "exit code 1" is not a diagnosis.
            foreach ($l in ($out -split "`n")) {
              $t = $l.Trim()
              if ($t -match 'WIX\d{3,4}|\[FAIL\]|\[!\]|error |Exception') {
                Write-Host "::error::$t"
              }
            }
            Write-Host "::error::build-msi.ps1 exited $LASTEXITCODE"
            exit 1
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\jt-snmpd-*-x64.msi | Select-Object -First 1
          $h = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($msi.Name)" | Out-File "$($msi.FullName).sha256" -Encoding ascii
          Write-Host "SHA256 $h"
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compose the release notes
        # English first, Traditional Chinese second: this project ships
        # worldwide, and a release page that opens in Chinese is unreadable to
        # most of the people who land on it. Every line here is a complete
        # sentence on one line — GitHub renders Markdown, so a hard break in
        # the middle of a sentence shows up as a break in the rendered page.
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $pages = "https://jasoncheng7115.github.io/jt-snmpd/"
          $msi = "jt-snmpd-$env:VERSION-x64.msi"
          $body = @()
          $body += "A read-only SNMP agent that serves Windows host metrics to LibreNMS through standard MIBs."
          $body += ""
          $body += "**[Documentation and screenshots]($pages)**"
          $body += ""
          $body += "## Install"
          $body += ""
          $body += "Download ``$msi`` from the Assets below, verify it against ``$msi.sha256``, then either double-click it for the settings dialog, or install from the command line:"
          $body += ""
          $body += '```powershell'
          $body += "# Command line / unattended - also the form to use for GPO software deployment"
          $body += "msiexec /i $msi /qn MANAGEMENTNETWORKS=10.0.0.0/24 COMMUNITY=your-community"
          $body += '```'
          $body += ""
          $body += "The installer is fully self-contained and downloads nothing. The built-in Windows SNMP Service is not a prerequisite: supply a community and that is all it needs. If one is already running, the installer carries over its community, sysContact and sysLocation, then disables it (disabled, not removed) and restores it on uninstall."
          $body += ""
          $body += "> **This installer is not Authenticode signed**, so SmartScreen will warn on a double-click and the UAC prompt will show an unknown publisher. Verify the SHA-256 above instead, and see [Code signing](https://jasoncheng7115.github.io/jt-snmpd/code-signing.html) for WDAC/AppLocker environments."
          $body += ""
          $body += "Full changes: [CHANGELOG.md](https://github.com/$repo/blob/main/CHANGELOG.md)"
          $body += ""
          $body += "---"
          $body += ""
          $body += "## 繁體中文"
          $body += ""
          $body += "以標準 MIB 將 Windows 主機的監控資料提供給 LibreNMS 的唯讀 SNMP Agent。**[說明文件與畫面]($pages)**"
          $body += ""
          $body += "請由下方 Assets 下載 ``$msi``，以 ``$msi.sha256`` 驗證雜湊，接著可直接點兩下開啟設定對話框，或以命令列安裝（上方指令同時也是 GPO 軟體派送所使用的形式）。"
          $body += ""
          $body += "安裝檔把需要的東西全部包在裡面，安裝過程不上網下載任何東西。不需要事先安裝 Windows 內建的 SNMP Service，填上 community 就能用。機器上如果已經有內建服務在跑，安裝程式會沿用它的 community、sysContact 與 sysLocation，然後將它停用（停用，不移除），並在解除安裝時自動還原。"
          $body += ""
          $body += "> **本安裝檔未經 Authenticode 簽章**，因此點兩下安裝時 SmartScreen 會出現警告，UAC 提示的發行者會顯示為「不明」。請改以上方的 SHA-256 驗證；WDAC / AppLocker 環境請見[程式碼簽章](https://jasoncheng7115.github.io/jt-snmpd/code-signing_zh-TW.html)。"
          $body += ""
          $body += "完整變更請見 [CHANGELOG_zh-TW.md](https://github.com/$repo/blob/main/CHANGELOG_zh-TW.md)。"
          $body -join "`n" | Out-File RELEASE_NOTES.md -Encoding utf8

      - name: Create the Release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' }
                 else { '${{ inputs.tag }}' }
          gh release create $tag `
            "$env:MSI_PATH" "$env:MSI_PATH.sha256" `
            --title "jt-snmpd $tag" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
